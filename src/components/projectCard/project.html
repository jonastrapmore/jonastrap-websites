<div class="card h-100 border-0 shadow-sm">
  <div class="ratio ratio-16x9 bg-light overflow-hidden">
    <img id="image" class="img-fluid object-fit-cover" alt="Project" loading="lazy" decoding="async">
  </div>
  <div class="card-body d-flex flex-column p-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <small id="subtitle" class="text-muted"></small>
      <span id="year" class="badge trap-bg-primary"></span>
    </div>
    <h5 id="title" class="card-title trap-text-primary mb-2"></h5>
    <p id="description" class="card-text flex-grow-1 text-muted mb-3"></p>
    <div id="tags" class="d-flex flex-wrap gap-1 mb-3"></div>
    <a id="link" class="btn btn-custom trap-bg-primary mt-auto align-self-start"
       target="_blank" rel="noopener">
      Bekijk Project <i class="bi bi-box-arrow-up-right"></i>
    </a>
  </div>
</div>
